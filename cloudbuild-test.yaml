  _VITE_FIREBASE_AUTH_DOMAIN: 'coherence-ominichannel-fs.firebaseapp.com'
  _VITE_FIREBASE_PROJECT_ID: 'coherence-ominichannel-fs'
  _VITE_FIREBASE_STORAGE_BUCKET: 'coherence-ominichannel-fs.firebasestorage.app'
  _VITE_FIREBASE_MESSAGING_SENDER_ID: '894828119087'
  _VITE_FIREBASE_APP_ID: '1:894828119087:web:3cb2164c2d1efd80e2f2da'
  _VITE_GOOGLE_CLIENT_ID: '4105010761-t3s393nba2m4asemki2k1ffotqeh5ep4.apps.googleusercontent.com'
  _VITE_PORTAL_URL: 'https://coherence-portal-test-c5nbfc5meq-uc.a.run.app'
  _TRIGGER_NAME: 'Deploy-monitoria-test-env'

images:
  - 'gcr.io/$PROJECT_ID/monitoria-test-env:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/monitoria-test-env:latest'