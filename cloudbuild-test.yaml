steps:
  # Etapa 1: Instala dependências do Frontend
  - name: 'node:20'
    entrypoint: 'npm'
    dir: 'frontend'
    args: ['install']

  # Etapa 2: Build do Frontend (env vars via substitutions)
  - name: 'node:20'
    entrypoint: 'bash'
    dir: 'frontend'
    args:
      - '-c'
      - 'rm -rf dist && touch .cache-bust && date > .cache-bust && export VITE_API_URL=$_VITE_API_URL VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET=$_VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID=$_VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID VITE_PORTAL_URL=$_VITE_PORTAL_URL && npm run build'

  # Etapa 3: Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/monitoria-test-env:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/monitoria-test-env:latest',
      '.'
    ]

  # Etapa 4: Push das imagens
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria-test-env:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria-test-env:latest']

  # Etapa 5: Deploy no Cloud Run (ambiente TESTE — service monitoria-test-env)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'monitoria-test-env'
      - '--image'
      - 'gcr.io/$PROJECT_ID/monitoria-test-env:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--execution-environment=gen2'
      - '--allow-unauthenticated'
      - '--cpu=4'
      - '--memory=8Gi'
      - '--port=8080'
      # NEW (06/07/2026): cpu-throttling=false. Em Cloud Run, default e'
      # true (container usa so ~20% da CPU fora de requests HTTP). Whisper
      # e' CPU-heavy e roda em BackgroundTasks in-process (Fase C) ->
      # sem isso, audio de 4min leva 30-50min. Producao ja tem esse
      # annotation e processa em ~3-5min.
      # NOTA: --no-cpu-throttling e' a sintaxe aceita pelo gcloud no
      # cloudsdktool image do Cloud Build (--cpu-throttling=false falha
      # com 'ignored explicit argument').
      - '--no-cpu-throttling'
      # REMOVIDO (06/07/2026 - Plano A++): GCS FUSE mount do SQLite.
      # Migracao completa para Firestore — nao ha mais SQLite local.
      # Bucket `coherence-ominichannel-fs-db-bucket` ainda existe mas nao e' mais usado.
      # Sera removido em sprint futura de cleanup.
      - '--set-env-vars=FIRESTORE_PROJECT_ID=coherence-ominichannel-fs,PORTAL_API_URL=https://coherence-portal-test-c5nbfc5meq-uc.a.run.app,PERM_CACHE_TTL_SEC=300,GOOGLE_CLIENT_ID=,OMP_NUM_THREADS=2,PYTHONUNBUFFERED=1'
      - '--quiet'

substitutions:
