steps:
  # Etapa 1: Build da imagem Docker do WORKER
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'Dockerfile.worker',
      '-t', 'gcr.io/$PROJECT_ID/monitoria-whisper-worker:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/monitoria-whisper-worker:latest',
      '.'
    ]

  # Etapa 2: Push das imagens
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria-whisper-worker:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria-whisper-worker:latest']

  # NEW (05/07/2026): deploy automatico do worker com probes para manter warm.
  # - startup-probe: tolera cold-start de ~60s (modelo Whisper + Pub/Sub init).
  # - liveness-probe: ping a cada 30s para Cloud Run manter instancia ativa
  #   entre jobs, sem precisar de min-instances (custo ~0 USD quando idle).
  # - env vars injetadas individualmente (DIARIO_BORDO 03/07 - PowerShell bug).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'monitoria-whisper-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/monitoria-whisper-worker:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--execution-environment=gen2'
      - '--no-allow-unauthenticated'
      - '--cpu=4'
      - '--memory=4Gi'
      - '--port=8080'
      - '--timeout=900'
      # NEW (06/07/2026): cpu-throttling=false. Whisper e' CPU-heavy;
      # sem isso, default Cloud Run so libera ~20% CPU fora de requests,
      # fazendo transcricao ficar 5-10x mais lenta. Producao ja tem.
      # NOTA: --no-cpu-throttling e' a sintaxe aceita (--cpu-throttling=false falha).
      - '--no-cpu-throttling'
      - '--concurrency=1'
      - '--min-instances=0'
      # NEW (08/07/2026 - Plano Ultra-Economico): memory 8GiB -> 4GiB,
      # max-instances 3 -> 2. Custo ~$110/mes para 600 calls/dia.
      # Audio max 20MB por arquivo (validado no upload, GUARDRAILS Regra #11).
      - '--max-instances=2'
      # NEW (08/07/2026 - Cold start fix): Startup CPU Boost. Acelera o carregamento
      # do Whisper (~1.5GB do disco para RAM) em 2-4x durante o boot. Cloud Run
      # aloca ate 4x mais CPU nos primeiros 10s de inicializacao. Custo $0.
      # Reduz cold start de ~60s para ~15-30s.
      # NOTA: a flag correta do gcloud e' --cpu-boost (nao --startup-cpu-boost).
      - '--cpu-boost'
      # REMOVIDO (06/07/2026 - Plano A++): GCS FUSE mount do SQLite.
      # Worker agora le/escreve via Firestore. Nao precisa mais do bucket compartilhado.
      - '--startup-probe=httpGet.path=/healthz,initialDelaySeconds=15,periodSeconds=5,timeoutSeconds=3,failureThreshold=18'
      - '--liveness-probe=httpGet.path=/healthz,periodSeconds=30,timeoutSeconds=3,failureThreshold=3'
      - '--update-env-vars=GCP_PROJECT=coherence-ominichannel-fs'
      - '--update-env-vars=PUBSUB_TOPIC=monitoria-whisper-jobs'
      - '--update-env-vars=PUBSUB_SUBSCRIPTION=monitoria-whisper-jobs-worker'
      - '--update-env-vars=AUDIO_BUCKET=coherence-monitoria-audios-tmp'
      - '--update-env-vars=WORKER_CALLBACK_URL=https://monitoria-test-env-894828119087.us-central1.run.app'
      - '--update-env-vars=OMP_NUM_THREADS=2'
      - '--update-env-vars=PYTHONUNBUFFERED=1'
      - '--update-env-vars=WHISPER_DOWNLOAD_ROOT=/app/whisper_models'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/monitoria-whisper-worker:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/monitoria-whisper-worker:latest'