options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Puxa imagem anterior como cache
  - name: 'gcr.io/cloud-builders/docker'
    args: ['pull', 'gcr.io/$PROJECT_ID/monitoria-worker:latest']
    allowFailure: true

  # Build com cache
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', 'gcr.io/$PROJECT_ID/monitoria-worker:latest',
      '-f', 'Dockerfile.worker',
      '-t', 'gcr.io/$PROJECT_ID/monitoria-worker:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/monitoria-worker:latest',
      '.'
    ]

  # Push das imagens
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria-worker:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria-worker:latest']

  # Deploy no Cloud Run (Worker producao)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'monitoria-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/monitoria-worker:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--execution-environment=gen2'
      - '--no-allow-unauthenticated'
      - '--cpu=4'
      - '--memory=4Gi'
      - '--port=8080'
      - '--timeout=3600'
      - '--cpu-throttling'
      - '--concurrency=1'
      - '--min-instances=0'
      - '--max-instances=4'
      - '--cpu-boost'
      - '--startup-probe=httpGet.path=/healthz,initialDelaySeconds=15,periodSeconds=5,timeoutSeconds=3,failureThreshold=18'
      - '--liveness-probe=httpGet.path=/healthz,periodSeconds=30,timeoutSeconds=3,failureThreshold=3'
      - '--update-env-vars=GCP_PROJECT=coherence-ominichannel-fs'
      - '--update-env-vars=PUBSUB_TOPIC=monitoria-whisper-jobs-prod'
      - '--update-env-vars=PUBSUB_SUBSCRIPTION=monitoria-whisper-jobs-worker-prod'
      - '--update-env-vars=PUBSUB_MODE=push'
      - '--update-env-vars=AUDIO_BUCKET=coherence-monitoria-audios-tmp'
      - '--update-env-vars=WORKER_CALLBACK_URL=https://monitoria.coherenceai.com.br'
      - '--update-env-vars=OMP_NUM_THREADS=4'
      - '--update-env-vars=PYTHONUNBUFFERED=1'
      - '--update-env-vars=COMMIT_SHA=$COMMIT_SHA'
      - '--update-env-vars=WHISPER_DOWNLOAD_ROOT=/app/whisper_models'
      - '--quiet'

  # 16/10/2026 (esteira v4): worker e' privado, entao a validacao le o COMMIT_SHA da
  # revisao implantada (o /health do worker devolve o mesmo valor, mas exige OIDC).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'validar-health'
    entrypoint: bash
    args:
      - '-c'
      - |
        SHA=$$(gcloud run services describe monitoria-worker --region=us-central1 --format=json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((e.get("value","") for e in d["spec"]["template"]["spec"]["containers"][0].get("env",[]) if e["name"]=="COMMIT_SHA"),""))')
        if [ "$$SHA" = "$COMMIT_SHA" ]; then echo "OK: monitoria-worker no ar com COMMIT_SHA=$$SHA"; exit 0; fi
        echo "FALHA: monitoria-worker com COMMIT_SHA='$$SHA', esperado $COMMIT_SHA" >&2
        exit 1

images:
  - 'gcr.io/$PROJECT_ID/monitoria-worker:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/monitoria-worker:latest'
