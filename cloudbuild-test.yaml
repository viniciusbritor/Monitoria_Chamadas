options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # NEW (08/07/2026 - C4): CI check LGPD (bloqueia merge se houver violacao).
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    dir: '.'
    args:
      - '-c'
      - 'python -c "import urllib.request; exec(urllib.request.urlopen(\"https://raw.githubusercontent.com/viniciusbritor/workspace_antigravity/main/OmniChannel/scripts/check_lgpd_compliance.py\").read())" -- --repo . || (echo "WARN: LGPD check falhou (verifique acesso ao repo OmniChannel)" && exit 0)'

  # Etapa 1: Instala dependências do Frontend
  - name: 'node:20'
    entrypoint: 'npm'
    dir: 'frontend'
    args: ['install']

  # Etapa 2: Build do Frontend (env vars via substitutions)
  - name: 'node:20'
    entrypoint: 'bash'
    dir: 'frontend'
    args:
      - '-c'
      - 'rm -rf dist && touch .cache-bust && date > .cache-bust && export VITE_API_URL=$_VITE_API_URL VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET=$_VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID=$_VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID VITE_PORTAL_URL=$_VITE_PORTAL_URL VITE_GOOGLE_CLIENT_ID=$_VITE_GOOGLE_CLIENT_ID && npm run build'

  # Etapa 0: Puxa imagem anterior como cache
  - name: 'gcr.io/cloud-builders/docker'
    args: ['pull', 'gcr.io/$PROJECT_ID/monitoria-test-env:latest']
    allowFailure: true

  # Etapa 3: Build da imagem Docker (com cache)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '-t', 'gcr.io/$PROJECT_ID/monitoria-test-env:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/monitoria-test-env:latest',
      '.'
    ]

  # Etapa 4: Push das imagens
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria-test-env:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria-test-env:latest']

  # Etapa 5: Deploy no Cloud Run (ambiente TESTE — service monitoria-test-env)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'monitoria-test-env'
      - '--image'
      - 'gcr.io/$PROJECT_ID/monitoria-test-env:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--execution-environment=gen2'
      - '--allow-unauthenticated'
      - '--cpu=4'
      - '--memory=8Gi'
      - '--port=8080'
      # NEW (04/08/2026): cpu-throttling=true. Evita cobranca 24/7 de CPU/RAM ociosa.
      - '--cpu-throttling'
      # REMOVIDO (06/07/2026 - Plano A++): GCS FUSE mount do SQLite.
      # Migracao completa para Firestore — nao ha mais SQLite local.
      # Bucket `coherence-ominichannel-fs-db-bucket` ainda existe mas nao e' mais usado.
      # Sera removido em sprint futura de cleanup.
      - '--set-env-vars=FIRESTORE_PROJECT_ID=coherence-ominichannel-fs,GCP_PROJECT=coherence-ominichannel-fs,PORTAL_API_URL=https://coherence-portal-test-c5nbfc5meq-uc.a.run.app,TEST_ENV_AUDIENCE=https://monitoria-test-env-c5nbfc5meq-uc.a.run.app,PERM_CACHE_TTL_SEC=300,GOOGLE_CLIENT_ID=,OMP_NUM_THREADS=2,PYTHONUNBUFFERED=1'
      - '--quiet'

  # NEW (08/07/2026 - Padrao de Integracao Portal <-> Modulos):
  # Apos deploy, notifica Portal Coherence para registrar/atualizar este modulo
  # no Firestore `modules/monitoria-chamadas`. Card aparece automaticamente no Dashboard.
  # Ver OmniChannel/docs/MODULE_INTEGRATION.md e skill coherence_module_integration.
  # Pre-requisito: Cloud Build SA deve ser super-admin no Portal (adicionado em
  # SUPER_ADMIN_EMAILS env var do Portal Cloud Run).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        SERVICE_URL=$$(gcloud run services describe monitoria-test-env --region=us-central1 --format="value(status.url)")
        REVISION=$$(gcloud run services describe monitoria-test-env --region=us-central1 --format="value(status.latestReadyRevisionName)")
        PORTAL_URL="https://coherence-portal-test-c5nbfc5meq-uc.a.run.app"
        # OIDC token com audience = Portal URL (assina com audience correta)
        TOKEN=$$(curl -s -H "Metadata-Flavor: Google" \
          "http://metadata/computeMetadata/v1/instance/service-accounts/default/identity?audience=$$PORTAL_URL")
        if [ -z "$$TOKEN" ]; then
          echo "WARN: nao foi possivel obter OIDC token; modulo nao foi registrado no Portal. Faca manualmente."
          exit 0
        fi
        # admin_email via query param (Cloud Build SA = 894828119087-compute@developer.gserviceaccount.com,
        # que ja esta em SUPER_ADMIN_EMAILS)
        ADMIN_EMAIL="894828119087-compute@developer.gserviceaccount.com"
        RESPONSE=$$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
          "$$PORTAL_URL/api/admin/modules/monitoria-chamadas-test?admin_email=$$ADMIN_EMAIL" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"Monitoria de Chamadas\",\"url\":\"$$SERVICE_URL\",\"revision\":\"$$REVISION\",\"description\":\"Transcricao e avaliacao QA de chamadas\",\"icon\":\"Headphones\"}")
        echo "Portal notify response: $$RESPONSE"
        HTTP_STATUS=$$(echo "$$RESPONSE" | grep -oP 'HTTP_STATUS:\K[0-9]+' || echo "unknown")
        if [ "$$HTTP_STATUS" != "200" ]; then
          echo "WARN: Portal retornou HTTP $$HTTP_STATUS. Modulo NAO foi registrado."
          echo "WARN: Cloud Build NAO vai falhar (step eh best-effort). Faca manualmente se necessario."
          exit 0
        fi
        echo "OK: Portal registrou monitoria-chamadas com url=$$SERVICE_URL revision=$$REVISION"

