options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # CI check LGPD (bloqueia merge se houver violacao).
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    dir: '.'
    args:
      - '-c'
      - 'python -c "import urllib.request; exec(urllib.request.urlopen(\"https://raw.githubusercontent.com/viniciusbritor/workspace_antigravity/main/OmniChannel/scripts/check_lgpd_compliance.py\").read())" -- --repo . || (echo "WARN: LGPD check falhou (verifique acesso ao repo OmniChannel)" && exit 0)'

  # Etapa 1: Instala dependencias do Frontend
  - name: 'node:20'
    entrypoint: 'npm'
    dir: 'frontend'
    args: ['install']

  # Etapa 2: Build do Frontend
  - name: 'node:20'
    entrypoint: 'bash'
    dir: 'frontend'
    args:
      - '-c'
      - 'rm -rf dist && touch .cache-bust && date > .cache-bust && export VITE_API_URL=$_VITE_API_URL VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET=$_VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID=$_VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID VITE_PORTAL_URL=$_VITE_PORTAL_URL && npm run build'

  # Puxa imagem anterior como cache
  - name: 'gcr.io/cloud-builders/docker'
    args: ['pull', 'gcr.io/$PROJECT_ID/monitoria:latest']
    allowFailure: true

  # Build da imagem Docker (com cache)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', 'gcr.io/$PROJECT_ID/monitoria:latest',
      '-t', 'gcr.io/$PROJECT_ID/monitoria:$_COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/monitoria:latest',
      '.'
    ]

  # Push das imagens
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria:$_COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/monitoria:latest']

  # Deploy no Cloud Run (producao)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'monitoria'
      - '--image'
      - 'gcr.io/$PROJECT_ID/monitoria:$_COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--execution-environment=gen2'
      - '--allow-unauthenticated'
      - '--cpu=4'
      - '--memory=8Gi'
      - '--port=8080'
      - '--no-cpu-throttling'
      - '--set-env-vars=FIRESTORE_PROJECT_ID=coherence-ominichannel-fs,PUBSUB_TOPIC=monitoria-whisper-jobs-prod,PORTAL_API_URL=https://coherence-portal-test-453yjxgtta-uc.a.run.app,TEST_ENV_AUDIENCE=https://monitoria.coherenceai.com.br,PERM_CACHE_TTL_SEC=300,GOOGLE_CLIENT_ID=,OMP_NUM_THREADS=2,PYTHONUNBUFFERED=1'
      - '--quiet'

  # Notifica Portal Coherence (producao)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        SERVICE_URL=$$(gcloud run services describe monitoria --region=us-central1 --format="value(status.url)")
        REVISION=$$(gcloud run services describe monitoria --region=us-central1 --format="value(status.latestReadyRevisionName)")
        PORTAL_URL="https://coherence-portal-test-453yjxgtta-uc.a.run.app"
        TOKEN=$$(curl -s -H "Metadata-Flavor: Google" \
          "http://metadata/computeMetadata/v1/instance/service-accounts/default/identity?audience=$$PORTAL_URL")
        if [ -z "$$TOKEN" ]; then
          echo "WARN: nao foi possivel obter OIDC token; modulo nao foi registrado no Portal. Faca manualmente."
          exit 0
        fi
        PROJECT_NUMBER=$$(gcloud projects describe $PROJECT_ID --format="value(projectNumber)")
        ADMIN_EMAIL="$$PROJECT_NUMBER-compute@developer.gserviceaccount.com"
        RESPONSE=$$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
          "$$PORTAL_URL/api/admin/modules/monitoria-chamadas?admin_email=$$ADMIN_EMAIL" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"Monitoria de Chamadas\",\"url\":\"$$SERVICE_URL\",\"revision\":\"$$REVISION\",\"description\":\"Transcricao e avaliacao QA de chamadas\",\"icon\":\"Headphones\"}")
        echo "Portal notify response: $$RESPONSE"
        HTTP_STATUS=$$(echo "$$RESPONSE" | grep -oP 'HTTP_STATUS:\K[0-9]+' || echo "unknown")
        if [ "$$HTTP_STATUS" != "200" ]; then
          echo "WARN: Portal retornou HTTP $$HTTP_STATUS. Modulo NAO foi registrado."
          echo "WARN: Cloud Build NAO vai falhar (step eh best-effort). Faca manualmente se necessario."
          exit 0
        fi
        echo "OK: Portal registrou monitoria-chamadas com url=$$SERVICE_URL revision=$$REVISION"

substitutions:
  _VITE_API_URL: 'https://monitoria.coherenceai.com.br'
  _VITE_FIREBASE_API_KEY: 'AIzaSyAIMGRNFUIBBueB8xk0jlTWA-EfpdjywDQ'
  _VITE_FIREBASE_AUTH_DOMAIN: 'coherence-ominichannel-fs.firebaseapp.com'
  _VITE_FIREBASE_PROJECT_ID: 'coherence-ominichannel-fs'
  _VITE_FIREBASE_STORAGE_BUCKET: 'coherence-ominichannel-fs.firebasestorage.app'
  _VITE_FIREBASE_MESSAGING_SENDER_ID: '894828119087'
  _VITE_FIREBASE_APP_ID: '1:894828119087:web:3cb2164c2d1efd80e2f2da'
  _VITE_PORTAL_URL: 'https://coherence-portal-test-453yjxgtta-uc.a.run.app'

images:
  - 'gcr.io/$PROJECT_ID/monitoria:$_COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/monitoria:latest'
